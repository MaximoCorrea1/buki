<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Book Catcher</title>
    <style>
      :root { color-scheme: dark; }
      body {
        width: 300px;
        max-height: 520px;
        overflow-y: auto;
        margin: 0;
        padding: 14px 16px;
        background: #211c1a;
        color: #f3efe7;
        font: 14px/1.4 system-ui, sans-serif;
      }
      h1 { font-size: 15px; margin: 0 0 10px; color: #e7b24c; letter-spacing: 0.02em; }
      h3 {
        margin: 14px 0 4px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        opacity: 0.6;
      }
      a { color: #e7b24c; text-decoration: none; font-size: 11px; }
      a:hover { text-decoration: underline; }
      .muted { opacity: 0.6; }
      .row { position: relative; padding: 4px 22px 4px 0; }
      .title { font-weight: 600; }
      .author { opacity: 0.7; font-size: 12px; }
      .remove {
        position: absolute;
        top: 4px;
        right: 0;
        background: transparent;
        border: none;
        color: #f3efe7;
        opacity: 0.35;
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        padding: 2px 4px;
      }
      .remove:hover { opacity: 1; color: #7c3a2e; }
      .remove:focus-visible { outline: 2px solid #e7b24c; opacity: 1; }
    </style>
  </head>
  <body>
    <h1>your shelf</h1>
    <div id="app"></div>
    <script src="dist/popup.js"></script>
  </body>
</html>
