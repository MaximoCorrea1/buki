<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Buki</title>
    <!-- Settles the mood before the first paint, and it is the only script in this head.
         Deferring it paints one mood and swaps to the other, which is the flash every
         theme toggle ships with. It is an external file rather than an inline block
         because MV3's default extension CSP is script-src 'self', which blocks an inline
         script outright: this is the only way to be synchronous here. See theme.ts. -->
    <script src="dist/theme.js"></script>
    <style>
      /* ------------------------------------------------------------------
         Buki: the shelf.

         Books stand FACE OUT, four to a board. A book with no cover art gets
         one Buki draws: a deep dyed binding, two stamped rules, and the
         book's own character tile repeated into cloth. See
         src/extension/generatedCover.ts and docs/brand.md.

         The piles are places, not headings. One scroll containing four
         groups made them a typographic convention; you could not be IN Now.
         ------------------------------------------------------------------ */
      /* ONE family, and it replaced two. Instrument 30KB plus Petrona 44KB became Manrope
         25KB, so the extension carries a third of the type it used to and ships it in
         every install rather than serving it on demand.

         The serif went for the same reason it went from the landing on 2026-08-15: a
         bookish display serif beside real book covers is two things saying the same thing.
         `--serif` below is untouched and still sets book titles, but it is the SYSTEM
         serif and costs nothing to ship. See docs/brand.md, "Type on the landing".

         MANROPE SHIPS NO ITALIC. `font-synthesis: none` on <html> makes the browser refuse
         to shear the roman rather than quietly producing the counterfeit brand.md records
         reaching production once. Nothing here asks for an italic; this makes it
         impossible rather than unlikely. */
      @font-face {
        font-family: "Manrope";
        src: url("fonts/manrope.woff2") format("woff2-variations");
        font-weight: 200 800;
        font-style: normal;
        font-display: block;
      }
      :root {
        /* iOS NEUTRALS, AND EXACTLY TWO COLOURS KEPT. Rewritten 2026-08-16.

           The panel was cream and tan: --paper #fbf7ec, --board #e6dcc2, --sunk #f3ecd9.
           Maximo's words were "not so much browns and veiges", then "more ios ios ios".
           So the neutrals are Apple's own, top to bottom, and the two things that actually
           carry this product's identity stay exactly where they were: the cobalt accent
           and the five book dyes. Swapping those would desync the mark and the landing and
           buy nothing.

           TRUE BLACK AT NIGHT is not a stylistic flourish. It is what iOS ships and what
           an OLED panel wants, and it gives the lifted greys somewhere to lift from, which
           the old navy did not: the selected segment measured 1.07:1 against its own track.

           WHERE THIS DEPARTS FROM APPLE, AND WHY. iOS secondaryLabel is #6C6C74, which
           measures 4.30:1 on the light fill. This repo's rule is that a passing ratio is
           not the test and nothing is allowed to read faded, after "WAY MORE CONTRAST! NO
           FADED FONTS!" was raised twice. So --muted is #484852 and #a8a8b0, both of which
           clear 7:1 on their worst ground. Apple's value loses to Maximo's rule.

           Measured with tools/mark.mjs's contrast(), never estimated:
             ink on paper/card/sunk    16.89 / 18.85 / 15.59  by day
                                       21.00 / 17.01 / 18.24  at night
             muted, worst ground        7.47 day, 7.21 night
             accent on paper            9.27 day, 7.78 night
             paper on accent            9.27 / 7.78            (a filled button's label)

           THE DYES DO NOT APPEAR HERE. A binding is a dye, not a status colour, and a book
           keeps its cloth in any light, so --stamp and --stamp-dim are one value in both
           moods. src/shared/extensionTokens.test.ts enforces the rest. */
        color-scheme: light dark;

        /* The ground and the two surfaces on it. Apple's grouped-background idiom: a grey
           page carrying white cards by day, true black carrying lifted greys at night. */
        --paper: light-dark(#f2f2f7, #000000);
        --card: light-dark(#ffffff, #1c1c1e);
        --sunk: light-dark(#e9e9ef, #151517);

        /* THE SEGMENTED CONTROL'S THUMB, and it needed its own token. It used to be
           --card, which measured 1.18:1 against its own track by day and 1.12:1 at night,
           so the chosen pile read only by its shadow and at night a shadow on a dark ground
           does nothing at all. By day white-on-grey at 1.21:1 is exactly what Apple ships,
           carried entirely by the shadow. At night Apple lifts the thumb for real, so this
           does too: #48484a is 2.00:1 off the track with a white label at 9.12:1. */
        --thumb: light-dark(#ffffff, #48484a);

        /* The board, still three solid bands and a cast shadow, now in neutrals. The flat
           rule still governs the plank: no gradient. What makes it read is the sequence of
           the three in the direction light falls, not any pair clearing a ratio. */
        --board: light-dark(#d8d8de, #38383a);
        --board-hi: light-dark(#f0f0f4, #48484a);
        --board-lo: light-dark(#c4c4cc, #232325);

        --ink: light-dark(#111114, #ffffff);
        --muted: light-dark(#484852, #a8a8b0);

        /* KEPT, deliberately. Cobalt is the mark's accent and the landing's, and it is the
           one hue this panel shares with the rest of the product. */
        --accent: light-dark(#1231a8, #7f9bea);
        --select: light-dark(#d6defa, #1f2a4a);

        /* Neutral, where it was rgba(20,16,14,.4): a warm black over the cream composited
           to about #a09a8e, which is a brown wash over the whole shelf and was the beige
           complaint at its worst. It also BLURS now, which is the Control Centre idiom and
           the one place a scrim earns a material. */
        --scrim: light-dark(rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0.5));
        --shadow: light-dark(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.55));
        --shadow-deep: light-dark(rgba(0, 0, 0, 0.22), rgba(0, 0, 0, 0.8));

        /* MATERIALS. The transparency goes where this panel genuinely has layers: the
           masthead is sticky over a shelf that scrolls under it, and the scrim covers it.
           Nowhere else. This is the same line docs/brand.md already draws for the catch
           tray, one surface along: glass where we own what is behind it, opaque where we
           do not. The tray therefore stays opaque and always will. */
        --material: light-dark(
          color-mix(in srgb, #f2f2f7 72%, transparent),
          color-mix(in srgb, #000000 62%, transparent)
        );
        --material-solid: light-dark(#f2f2f7, #000000);
        /* Apple's separator, at Apple's alpha, and drawn at 0.5px where the display can. */
        --hairline: light-dark(rgba(60, 60, 67, 0.29), rgba(84, 84, 88, 0.65));

        /* Three radii now. The sheet is a sheet and wants the larger iOS corner; the old
           14px on a 500px card read as a dialog rather than as a card you picked up. */
        --r-xl: 20px;
        --r-lg: 14px;
        --r-md: 10px;

        --mark-spine: var(--ink);
        /* ONE VALUE IN BOTH MOODS, which it could not be until now. The caught spine has
           to separate from its NEIGHBOURS, and the neighbours used to be navy by day and
           cream by night, so it had to invert with them. With neutral spines it does not:
           #2f7fd6 measures 4.60:1 against the day spine and 4.10:1 against the night one,
           clearing the bar from both sides. tools/mark.mjs carries both grounds and
           src/shared/mark.test.ts reads this line against them. */
        --mark-caught: #2f7fd6;

        /* The two inks a binding gets, and no more. One value in both moods, forever. */
        --stamp: #faf7f2;
        --stamp-dim: #d6cec2;

        /* The buy pill, in jade, which is one of the five dyes rather than a green picked
           to look like one. It reads as its own kind of action and never competes with the
           focus ring. Jade on the night ground is 8.32:1 and 7.38:1 on the hover. */
        --buy-bg: light-dark(#e7f5ee, #10352a);
        --buy-bg-hi: light-dark(#d8efe3, #143e31);
        --buy-ink: light-dark(#0f6b4a, #6fe0b6);

        --ui: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
        --display: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
        /* The system serif, and the only serif left. It sets BOOK TITLES and nothing else,
           which is the rule in docs/brand.md, and it ships no bytes. */
        --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        /* Mono is for data that lines up: the shelf count, the per-pile counts, and the
           cloth, which is a character grid and could not be anything else. */
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        /* Ionic's port of the iOS sheet curve, for anything that travels a distance. */
        --drawer: cubic-bezier(0.32, 0.72, 0, 1);

        /* THE GRAIN IS GONE. It was the tooth of a paper sheet, and this surface is not
           pretending to be paper any more. iOS surfaces are flat and clean, and noise over
           a true-black ground is just noise. It stays on the landing, which is still the
           world of the plates. */
      }

      /* THE SWITCH ACTUALLY SWITCHING, and this is separate from the line above it.
         `color-scheme: light dark` only says the surface UNDERSTANDS both moods; on its
         own, light-dark() follows the operating system and nothing else. Without these two
         rules data-theme is an attribute nobody reads: the button flips it, the label
         updates, and the panel does not move. Measured with a probe in the popup harness
         before they existed - data-theme=light, stored=light, body background rgb(8, 13,
         32), which is the night value. That is the landing's dead theme button in a
         different costume, and docs/brand.md records it.

         One property is all the switch changes, which is the whole argument for
         light-dark() over three copies of the palette. */
      :root[data-theme="light"] { color-scheme: light; }
      :root[data-theme="dark"] { color-scheme: dark; }

      * { box-sizing: border-box; }
      /* Refuse a synthesised face rather than shipping one. With one family and no italic
         file this makes the sheared counterfeit impossible instead of unlikely. */
      html { font-synthesis: none; }

      /* Surfaces the browser hands us with defaults belonging to no design system. */
      ::selection { background: var(--select); color: var(--ink); }
      :root { accent-color: var(--accent); caret-color: var(--accent); }
      :where(button, a, input, select, [tabindex]):focus-visible {
        outline: 2.5px solid var(--accent);
        outline-offset: 2px;
        border-radius: 3px;
      }
      /* Counts and dates line up in columns, so they get lining figures. */
      .count, .shelf-stat, time { font-variant-numeric: tabular-nums; }


      body {
        /* 560 gives a 118px cover four across, which is the smallest a title reads at.
           Chrome allows up to 800. One declaration, so this is a one-line change. */
        width: 560px;
        max-height: 600px;
        overflow-y: auto;
        overflow-x: hidden;
        margin: 0;
        padding: 0 0 10px;
        background-color: var(--paper);
        color: var(--ink);
        font: 14px/1.45 var(--ui);
        -webkit-font-smoothing: antialiased;
      }
      body::-webkit-scrollbar { width: 10px; }
      body::-webkit-scrollbar-thumb {
        background: var(--board);
        border: 3px solid var(--paper);
        border-radius: 5px;
      }

      /* --- masthead ------------------------------------------------------ */
      header {
        position: sticky;
        top: 0;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 14px 20px 12px;
        /* A MATERIAL, not a fill. The shelf scrolls underneath this, which is the one
           condition that earns a blur: there is something real behind it and we own what
           that something is. A hairline at Apple's own 0.29 alpha, drawn at half a pixel
           where the display can manage it. */
        background: var(--material);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border-bottom: 0.5px solid var(--hairline);
      }
      /* backdrop-filter is an enhancement. Without it the masthead has to be opaque, or
         book covers scroll through the wordmark. */
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        header { background: var(--material-solid); }
      }
      @media (prefers-reduced-transparency: reduce) {
        header { background: var(--material-solid); backdrop-filter: none; -webkit-backdrop-filter: none; }
      }
      header .brand { display: flex; align-items: center; gap: 8px; }
      header svg { display: block; flex: none; }
      /* Pinned to the corner rather than added as a third centred line. The header is a
         centred column, so anything in the flow makes a 560px panel taller to hold one
         link. This is the same move the catch card makes with its dismiss control: take
         it out of the flow so the mark and the count stay on the axis. */
      header .settings {
        position: absolute; top: 13px; right: 14px;
        font: 600 12px/1 var(--ui); letter-spacing: -0.002em;
        color: var(--muted); background: none; border: 0;
        padding: 4px; cursor: pointer;
      }
      @media (hover: hover) and (pointer: fine) {
        header .settings:hover { color: var(--accent); }
      }
      /* THE SWITCH, in the LEFT corner, and the corner is the point.
         Settings is already pinned right, out of the flow, so the mark and the count stay
         on the page's axis. A second control pinned to the SAME corner would crowd it and
         push the axis around, which is what the catch card's dismiss control was taken out
         of the flow to avoid. One at each corner instead: the header becomes symmetric
         rather than merely un-crowded, and the mark sits between them.

         The icon shows what pressing it will GET you, not what you have, which is the
         convention a phone uses: a moon while it is day. Both icons ship and only their
         opacity and rotation differ, so the switch never waits on a request to change
         state, and neither ever scales from 0, because nothing in the world appears out of
         nothing. */
      header .theme {
        position: absolute; top: 12px; left: 13px;
        width: 28px; height: 28px;
        display: grid; place-items: center;
        padding: 0; border: 0; border-radius: 999px;
        background: transparent; color: var(--muted);
        cursor: pointer;
        transition: transform 140ms var(--ease-out), background-color 140ms ease,
                    color 140ms ease;
      }
      header .theme:active { transform: scale(0.92); }
      header .theme:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      @media (hover: hover) and (pointer: fine) {
        header .theme:hover { background: var(--sunk); color: var(--ink); }
      }
      header .theme svg {
        position: absolute; width: 15px; height: 15px;
        fill: none; stroke: currentColor; stroke-width: 1.8;
        stroke-linecap: round; stroke-linejoin: round;
        transition: opacity 200ms var(--ease-out), transform 300ms var(--drawer);
      }
      header .theme .sun  { opacity: 0; transform: rotate(-70deg) scale(0.7); }
      header .theme .moon { opacity: 1; transform: none; }
      :root[data-theme="dark"] header .theme .sun  { opacity: 1; transform: none; }
      :root[data-theme="dark"] header .theme .moon { opacity: 0; transform: rotate(70deg) scale(0.7); }
      /* The wordmark. Manrope 800 at the landing's own tracking, so the shelf and the page
         say the name the same way — which they did not while one was a serif. */
      h1 {
        margin: 0;
        font-family: var(--display);
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      /* Mono earns its keep here: this is a COUNT, it changes as you save, and lining
         figures stop the header shifting by a pixel when 9 becomes 10. */
      .count {
        font: 600 11px/1 var(--mono);
        color: var(--muted);
        letter-spacing: 0.02em;
      }

      /* --- the piles ------------------------------------------------------
         A segmented control, on the page's axis. The same component appears in
         the sheet as the move control, so there is one idea to learn. */
      /* A segmented control, and now it is drawn like one. It was tracked uppercase mono,
         which is a LABEL treatment: it said "here is a category" where the control's whole
         argument is that a pile is a place you stand in. `PILE_LABEL` has always been
         sentence case ("Now", "Next"); only the CSS was shouting, so this is a stylesheet
         change and shelfView.ts is untouched.

         Capsules inside a capsule, per the third generation, and the selected segment is a
         raised white surface rather than a differently-coloured one. */
      /* An iOS segmented control, drawn the way iOS draws one: a sunk track, a thumb
         that LIFTS, and no ring around the track. The ring was doing the job the thumb
         should do, which is why the chosen pile never read as chosen. */
      .piles {
        display: flex;
        gap: 2px;
        width: fit-content;
        margin: 14px auto 0;
        padding: 2px;
        background: var(--sunk);
        border-radius: 999px;
      }
      .pile {
        display: flex;
        align-items: baseline;
        gap: 6px;
        padding: 7px 15px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font: 600 12.5px/1 var(--ui);
        letter-spacing: -0.004em;
        transition: background-color 140ms ease, color 140ms ease,
                    box-shadow 140ms ease, transform 140ms var(--ease-out);
      }
      .pile:active { transform: scale(0.96); }
      .pile .n { font: 600 11px/1 var(--mono); letter-spacing: 0.02em; color: var(--muted); }
      /* The thumb. Two shadows, near and far, because one soft shadow reads as a blur
         and one hard shadow reads as a border. This is the whole reason a 1.21:1 fill
         looks lifted on iOS. */
      .pile[aria-selected="true"] {
        background: var(--thumb);
        color: var(--ink);
        box-shadow: 0 0 0 0.5px var(--shadow), 0 3px 8px var(--shadow-deep);
      }
      .pile[aria-selected="true"] .n { color: var(--ink); }
      .pile:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
      .pile:disabled { cursor: default; opacity: 0.5; }
      @media (hover: hover) and (pointer: fine) {
        .pile:not([aria-selected="true"]):hover { color: var(--ink); }
      }

      /* --- search --------------------------------------------------------- */
      /* A filled field, not an outlined one. iOS fields have no border: the fill IS
         the affordance, which is also what docs/brand.md concluded for the landing's
         secondary button when its 1.38:1 ring turned out to be a boundary you cannot see. */
      #find {
        width: calc(100% - 40px);
        margin: 12px 20px 0;
        padding: 9px 12px;
        background: var(--sunk);
        color: var(--ink);
        border: 0;
        border-radius: var(--r-md);
        font: 13.5px/1.3 var(--ui);
      }
      #find::placeholder { color: var(--muted); }
      #find:focus {
        outline: 2px solid var(--ink);
        outline-offset: 1px;
        border-color: transparent;
      }

      .record {
        margin: 16px 20px 0;
        text-align: center;
        font: 600 12px/1 var(--ui);
        letter-spacing: -0.002em;
        color: var(--muted);
      }

      /* --- the shelf ------------------------------------------------------ */
      .shelf {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        /* start, NOT end. Every cover is the same aspect ratio at the same width, so
           aligning tops also aligns bottoms and the books stand on one line. Bottom
           alignment lines up the SLOT, so a two-line caption shoved its cover a line
           upward and the row stopped resting on the board. */
        align-items: start;
        padding: 14px 20px 0;
      }
      /* A BOARD, not a hairline.

         This was `height: 3px` with a 1px underline, which is the same shape the landing
         threw out with the note that "the section promises a shelf that looks like a shelf,
         and this was a 6px hairline gradient: the promise was made in the heading and not
         kept in the picture". This panel IS the shelf rather than a picture of one, so it
         owed that more than the landing did and had it less.

         Three SOLID bands and a cast shadow, never the landing's gradient: the flat rule in
         docs/brand.md governs this surface and the third generation's alpha licence
         explicitly does not reach it. A lit front edge, the body, the edge in shadow, and
         the shadow the board throws on whatever is under it. A shadow is depth rather than
         colour, which is the one thing the flat rule has always allowed.

         The lit edge is also what makes the shelf survive the night: the body measures
         1.45:1 against the page there, and one band at that value reads as nothing. */
      .plank {
        height: 9px;
        margin: 11px 20px 0;
        border-radius: 0 0 3px 3px;
        background: var(--board);
        border-top: 1px solid var(--board-hi);
        border-bottom: 2px solid var(--board-lo);
        box-shadow: 0 6px 12px -6px var(--shadow-deep);
      }

      .slot { min-width: 0; }
      .pick {
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        background: none;
        text-align: left;
        cursor: pointer;
        transition: transform 140ms var(--ease-out);
      }
      .pick:active { transform: scale(0.97); }
      .pick:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

      /* Books cast a shadow, because a book standing on a board does. They had none at
         all, which is what made the shelf read as a grid of rectangles rather than as
         furniture: the near shadow seats the book on the plank, the far one gives the row
         depth. Both are tokens, so they go black and heavier at night, where there is less
         ground left to darken.

         The lift is on the COVER and the press is on the button around it, deliberately. A
         running transform and a transition on the same property of the same element is the
         silent no-op docs/brand.md records from the landing's scroll cue. These are
         different elements, so the press scales a book that is already lifted. */
      .board,
      .art {
        width: 100%;
        aspect-ratio: 2 / 3;
        border-radius: 2px 3px 3px 2px;
        overflow: hidden;
        box-shadow: 0 1px 2px var(--shadow), 0 12px 22px -14px var(--shadow-deep);
        transition: transform 200ms var(--ease-out);
      }
      @media (hover: hover) and (pointer: fine) {
        .pick:hover .art,
        .pick:hover .board { transform: translateY(-3px); }
      }
      .art { display: block; object-fit: cover; background: var(--sunk); }
      .board {
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 11px;
        background: var(--binding);
        /* So the stamp can size itself off the BOARD rather than off a fixed pixel value.
           At 118px on the shelf the old fixed sizes were right; at 96px in the sheet the
           same value broke "The Fountainhead" across a line as "Fountainhe / ad". A drawn
           cover is the one cover we control, so it must never be the ugly one. */
        container-type: inline-size;
      }

      /* The cloth: the book's own mark, repeated. One node, not six hundred.
         Opacity on white over one solid ground resolves to one solid value, which is why
         this is not the blend the flat rule forbids. */
      .cloth {
        position: absolute;
        inset: 0;
        margin: 0;
        /* A 6px cell with a 4.5px glyph in it, so threads are separated in BOTH
           directions. Letting them touch horizontally merges equal neighbours into bars
           and the board reads as brick; separating only horizontally leaves the vertical
           runs and it reads as corduroy. Only the gap in both gives cloth. */
        font: 4.5px/6px var(--mono);
        letter-spacing: 3.4px;
        color: #ffffff;
        opacity: 0.13;
        pointer-events: none;
      }

      /* The signature: the two cords, seen face-on. On a spine they are raised; on a
         board they are stamped. */
      .rules {
        position: relative;
        flex: none;
        height: 5px;
        border-top: 1px solid var(--stamp-dim);
        border-bottom: 1px solid var(--stamp-dim);
      }

      .stamp {
        position: relative;
        margin-top: auto;
        font-family: var(--serif);
        color: var(--stamp);
        letter-spacing: -0.015em;
        /* break-word, not anywhere: break BETWEEN words first and only split one when it
           genuinely cannot fit. `anywhere` breaks eagerly, which is what put "ad" on its
           own line under "Fountainhe". */
        overflow-wrap: break-word;
        hyphens: auto;
      }
      /* The same three steps, expressed as a share of the board's own width so they hold
         at 118px on the shelf and at 96px in the sheet. 21/118, 15/118, 11.5/118. */
      .stamp.large { font-size: 17.8cqw; line-height: 1.02; }
      .stamp.medium { font-size: 12.7cqw; line-height: 1.08; }
      .stamp.small { font-size: 9.7cqw; line-height: 1.14; }

      .cap { margin-top: 9px; }
      .cap .t {
        font: 600 11.5px/1.22 var(--serif);
        color: var(--ink);
        /* Two lines always, so the author and the pile tag under every book on a shelf
           sit on the same line whether the title above them wrapped or not. */
        min-height: 2.44em;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      /* An author's name is not code, not data and not a measurement, so it is not
         monospace. Mono stays where it earns its keep: the shelf count, the tracked
         labels, and the cloth, which is a character grid and could not be anything else. */
      .cap .a {
        margin-top: 2px;
        font: 11px/1.3 var(--ui);
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cap .from {
        margin-top: 4px;
        font: 600 10.5px/1 var(--ui);
        letter-spacing: -0.002em;
        color: var(--muted);
      }

      /* --- the sheet ------------------------------------------------------ */
      /* Both of these matter, and the second one is why the whole popup was dead.
         `#sheet` is specificity (1,0,0) and the browser's own `[hidden] { display: none }`
         is (0,1,0), so a bare `#sheet { display: grid }` BEATS the hidden attribute: the
         sheet stayed laid out, fixed and full-viewport, swallowing every click on the
         shelf underneath it. Scoping the layout to :not([hidden]) makes a closed sheet an
         ordinary empty block with no size; the explicit [hidden] rule then makes it
         impossible for a future `display` here to resurrect the bug. */
      #sheet:not([hidden]) {
        position: fixed;
        inset: 0;
        z-index: 9;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      #sheet[hidden] { display: none; }
      /* A blurred scrim, which is the one other place this panel has a real layer: the
         shelf is behind it and we own the shelf. Control Centre does exactly this. */
      #scrim {
        position: fixed;
        inset: 0;
        background: var(--scrim);
        backdrop-filter: blur(10px) saturate(140%);
        -webkit-backdrop-filter: blur(10px) saturate(140%);
        transition: opacity 220ms var(--ease-out);
      }
      @media (prefers-reduced-transparency: reduce) {
        #scrim { backdrop-filter: none; -webkit-backdrop-filter: none; }
      }

      /* ONE COLUMN, ONE AXIS.

         This card used to be a left-aligned two-column block (cover beside the title, with
         the source link and the Buy pill hard left under it) sitting above two CENTRED
         controls. Two axes in a 500px card, and the one control that earns money was the
         stranded one. It also left about 120px of empty white to the right of the author,
         because the column had a title, a name, one small pill and nothing else to hold.

         Everything is on the page's axis now, in the order the card is actually used:
         the book, then where it goes, then what you can do with it, then the way out.
         No border: a card separates by its own fill plus a shadow, and on iOS a sheet has
         no outline at all. */
      .card {
        position: relative;
        width: 100%;
        padding: 26px 22px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        background: var(--card);
        border-radius: var(--r-xl);
        box-shadow: 0 1px 2px var(--shadow), 0 24px 48px -12px var(--shadow-deep);
        /* A modal is not anchored to a trigger, so it scales from its own centre. */
        transform-origin: center;
        transition: transform 260ms var(--drawer), opacity 200ms var(--ease-out);
      }
      /* Never from scale(0), and barely from 0.96: a sheet that jumps in reads as a
         dialog. Travel plus a whisper of scale on the drawer curve reads as a sheet. */
      #sheet[data-in="false"] .card { transform: translateY(10px) scale(0.985); opacity: 0; }
      #sheet[data-in="false"] #scrim { opacity: 0; }

      /* The cover, held. Bigger than it was, because it is now the top of the card rather
         than a thumbnail beside the title, and it is the thing you recognise the book by. */
      .card .held { width: 108px; margin-bottom: 14px; }
      .card h3 {
        margin: 0;
        font: 700 19px/1.22 var(--serif);
        letter-spacing: -0.015em;
        text-wrap: balance;
      }
      .card .by { margin-top: 4px; font-size: 13.5px; color: var(--ink); }

      /* THE PILE CONTROL IS THE PRIMARY INTERACTION, so it comes first and it is the one
         thing given room. The same component as the masthead's, which is the point: one
         idea to learn, and the control that says where a book is, is the one that moves it. */
      .card .piles { margin-top: 20px; }

      /* Buy is a real call to action now instead of a 3px pill hiding under an author's
         name. Full width, on the axis, in jade so it never competes with the focus ring.
         It stays SECOND, under the piles: filing the book is what the sheet is for, and a
         disclosed affiliate link that outranks the product's own job would be a dark
         pattern in a small way. */
      .card .buy {
        display: block;
        width: 100%;
        margin-top: 14px;
        padding: 12px 16px;
        border-radius: 999px;
        background: var(--buy-bg);
        color: var(--buy-ink);
        font: 700 14px/1 var(--ui);
        letter-spacing: -0.004em;
        text-decoration: none;
        transition: transform 140ms var(--ease-out), background-color 140ms ease;
      }
      .card .buy:active { transform: scale(0.97); }

      /* The provenance line: the one thing no competitor stores, so it is text on the axis
         rather than a link buried in a column. */
      .card .src {
        margin-top: 14px;
        color: var(--muted);
        font: 600 12.5px/1.4 var(--ui);
        text-decoration: none;
      }
      .card .src:focus-visible,
      .card .buy:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

      @media (hover: hover) and (pointer: fine) {
        .card .src:hover { color: var(--accent); text-decoration: underline; }
        .card .buy:hover { background: var(--buy-bg-hi); }
      }

      /* Out of the flow, so a centred column stays centred on the card rather than on
         whatever space is left beside a button. */
      .shut {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 999px;
        background: var(--sunk);
        color: var(--muted);
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        transition: transform 140ms var(--ease-out), background-color 140ms ease,
                    color 140ms ease;
      }
      .shut:active { transform: scale(0.92); }
      .shut:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
      @media (hover: hover) and (pointer: fine) {
        .shut:hover { color: var(--ink); }
      }

      /* Set apart, and not red. Red is for danger; removing a book you chose to save is a
         decision. A plain text button rather than an outlined one, which is what iOS uses
         for a destructive-but-ordinary action at the foot of a sheet, and it stops the card
         ending on two competing capsules. */
      .drop {
        margin-top: 6px;
        padding: 11px 14px;
        border: 0;
        background: none;
        color: var(--muted);
        cursor: pointer;
        font: 600 13px/1 var(--ui);
        transition: color 140ms ease, transform 140ms var(--ease-out);
      }
      .drop:active { transform: scale(0.97); }
      .drop:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 999px; }
      .drop:disabled { opacity: 0.5; cursor: default; }
      @media (hover: hover) and (pointer: fine) {
        .drop:hover { color: var(--ink); }
      }

      /* --- empty ---------------------------------------------------------- */
      .empty { margin: 24px 20px; color: var(--ink); line-height: 1.6; text-align: center; }
      .empty b { display: block; margin-bottom: 3px; color: var(--ink); font-size: 15px; }

      /* --- footer --------------------------------------------------------- */
      footer {
        margin: 18px 20px 0;
        padding-top: 10px;
        border-top: 1px solid var(--board);
        font-size: 11.5px;
        line-height: 1.5;
        color: var(--ink);
        text-align: center;
      }

      @media (prefers-reduced-motion: reduce) {
        .card,
        #scrim,
        .pick,
        .pile,
        .buy,
        .shut,
        .drop,
        .art,
        .board,
        header .theme,
        header .theme svg {
          transition-duration: 1ms;
        }
        /* Opacity stays, because it aids comprehension and causes no motion sickness. What
           goes is the position change, so the two icons cross-fade in place. */
        header .theme .sun,
        header .theme .moon { transform: none; }
        .pick:hover .art,
        .pick:hover .board { transform: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 100 100" aria-hidden="true">
          <!-- Redrawn as geometry from Maximo's drawing. The two cord rules are cut with a
               MASK rather than painted in the paper colour, so the gaps are transparent and
               the mark carries no background with it. The mask is applied inside the rotated
               group as well, so the caught spine's cords lean with it. -->
          <mask id="bk-cords">
            <rect x="-25" y="-25" width="150" height="150" fill="#fff" />
            <rect x="-25" y="64.6" width="150" height="1.9" fill="#000" />
            <rect x="-25" y="72.9" width="150" height="1.9" fill="#000" />
          </mask>
          <g mask="url(#bk-cords)" fill="var(--mark-spine)">
            <rect x="15" y="6" width="19" height="88" rx="9.5" />
            <rect x="66" y="6" width="19" height="88" rx="9.5" />
          </g>
          <g transform="rotate(-8 50 50)" mask="url(#bk-cords)">
            <rect x="40.5" y="7" width="19" height="86" rx="9.5" fill="var(--mark-caught)" />
          </g>
        </svg>
        <h1>Buki</h1>
      </div>
      <span class="count" id="count"></span>
      <!-- The first route from the shelf to settings the product has had. Without it the
           export the landing advertises is reachable only by right-clicking the toolbar
           icon, which nobody does. -->
      <button class="settings" type="button" id="settings">Settings</button>
      <!-- The label says what pressing it will DO, not what is showing, because that is
           what someone on a screen reader needs in order to decide whether to press it.
           theme.js keeps it in step, and nothing in popup.js touches this control, so no
           unrelated early return can bury it the way one buried the landing's for two
           days. -->
      <button class="theme" type="button" id="theme" aria-label="Switch to dark">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.1" />
          <path d="M12 2.6v2.2M12 19.2v2.2M4.35 4.35l1.56 1.56M18.09 18.09l1.56 1.56M2.6 12h2.2M19.2 12h2.2M4.35 19.65l1.56-1.56M18.09 5.91l1.56-1.56" />
        </svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z" />
        </svg>
      </button>
    </header>
    <main id="app"></main>
    <div id="sheet" hidden data-in="false"></div>
    <footer id="disclosure" hidden>
      Buy links are affiliate links. Buki may earn a small commission, at no cost to
      you. Nothing else about your shelf leaves this computer.
    </footer>
    <script src="dist/popup.js"></script>
  </body>
</html>
