<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Buki</title>
    <style>
      /* ------------------------------------------------------------------
         Buki — books lie flat, spine out, resting on a shelf board.

         The identity is the spine edge: cloth colour hashed from the book,
         with two raised cords. The cords are a white highlight over a dark
         shadow rather than a gold line, because a gold line disappears
         against marigold cloth — which is how the first version of this
         design shipped, with its signature detail invisible.
         ------------------------------------------------------------------ */
      :root {
        /* PAPER. The room (docs/index.html, and the card in the feed) is the moment of
           CATCHING: a lit shelf in the dark. This is the moment of READING your list, and
           a list is read on paper. The two are different jobs, so they are different
           materials, and the cloth spines carry the identity across both.

           Every value is flat. No gradient, no translucent layer over another colour:
           a spine is one solid ink, a rule is one solid hairline. */
        color-scheme: light;

        --paper: #faf7f2;
        --card: #ffffff;
        --board: #e3dcd2;
        --ink: #14100e;
        --muted: #5c5349;
        --accent: #8a5a00;
        --sunk: #f2ede4;

        /* The buy pill. Green rather than the accent, so it reads as its own kind of
           action and never competes with a focus ring. */
        --buy-bg: #e7f5ee;
        --buy-bg-hi: #d8efe3;
        --buy-ink: #0f6b4a;

        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      }

      * { box-sizing: border-box; }

      body {
        width: 360px;
        max-height: 560px;
        overflow-y: auto;
        overflow-x: hidden;
        margin: 0;
        padding: 0 0 10px;
        background: var(--paper);
        color: var(--ink);
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body::-webkit-scrollbar { width: 10px; }
      body::-webkit-scrollbar-thumb {
        background: var(--board);
        border: 3px solid var(--paper);
        border-radius: 5px;
      }

      /* --- masthead ------------------------------------------------------ */
      header {
        position: sticky;
        top: 0;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 13px 16px 11px;
        background: var(--paper);
        border-bottom: 1px solid var(--board);
      }
      header svg { display: block; flex: none; }
      h1 {
        margin: 0;
        flex: 1;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .count {
        font: 600 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
        color: var(--muted);
        letter-spacing: 0.02em;
      }

      /* --- filter (only rendered past 15 books) -------------------------- */
      #filter {
        width: calc(100% - 32px);
        margin: 11px 16px 0;
        padding: 8px 11px;
        background: var(--sunk);
        color: var(--ink);
        border: 1px solid var(--board);
        border-radius: 8px;
        font: 13px/1.3 system-ui, sans-serif;
      }
      #filter::placeholder { color: var(--muted); }
      #filter:focus {
        outline: 2px solid var(--ink);
        outline-offset: 1px;
        border-color: transparent;
      }

      /* --- group heading -------------------------------------------------- */
      h2 {
        position: sticky;
        top: 45px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        padding: 14px 16px 7px;
        background: var(--paper);
        font: 700 10.5px/1 ui-monospace, "SF Mono", Menlo, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h2 .n {
        padding: 2px 6px;
        border-radius: 20px;
        background: var(--board);
        font-size: 9.5px;
        letter-spacing: 0.04em;
      }

      /* --- a book --------------------------------------------------------- */
      .spine {
        position: relative;
        display: grid;
        grid-template-columns: 8px 36px 1fr auto;
        align-items: center;
        gap: 11px;
        padding: 10px 14px 11px 16px;
        /* The board: one hairline with a soft shadow beneath, so books rest
           on something rather than floating in a list. */
        border-bottom: 1px solid var(--board);
        border-bottom: 1px solid var(--board);
        opacity: 0;
        transform: translateY(6px);
        animation: rise 260ms var(--ease-out) forwards;
      }
      @keyframes rise { to { opacity: 1; transform: none; } }

      .spine.leaving {
        opacity: 0;
        transform: scale(0.97);
        transition: opacity 160ms var(--ease-out), transform 160ms var(--ease-out);
      }

      /* The cloth edge. Two cords, each a highlight over a shadow — visible
         on every cloth colour, and what a raised cord actually looks like. */
      .edge {
        align-self: stretch;
        min-height: 54px;
        border-radius: 2px;
        background:
          linear-gradient(#ffffff 1px, transparent 1px) 0 15px / 100% 1px no-repeat,
          linear-gradient(#ffffff 1px, transparent 1px) 0 37px / 100% 1px no-repeat,
          var(--cloth);
      }

      .cover {
        width: 36px;
        height: 54px;
        object-fit: cover;
        display: block;
        border-radius: 2px;
        background: var(--cloth);
        border: 1px solid var(--board);
      }
      /* No cover art: the cloth block carries the initial instead. Darkened over the
         same cloth, so it reads as a separate object from the spine edge beside it
         rather than merging into one L-shaped smear. */
      .cover.blank {
        display: grid;
        place-items: center;
        color: #ffffff;
        font: 800 16px/1 system-ui, sans-serif;
      }

      .meta { min-width: 0; }
      .title {
        font-weight: 700;
        letter-spacing: -0.011em;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .author {
        margin-top: 1px;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .links {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
        font-size: 11px;
        font-weight: 600;
      }
      .links a { text-decoration: none; }
      .links a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

      .src { color: var(--muted); }
      .src:hover { color: var(--accent); text-decoration: underline; }

      /* A pill, so it reads as an action rather than another link. Deliberately small:
         it sits below the author, never above the title, and carries no urgency. */
      .buy {
        flex: none;
        padding: 3px 9px;
        border-radius: 999px;
        background: var(--buy-bg);
        color: var(--buy-ink);
        transition: transform 140ms var(--ease-out), background-color 140ms ease;
      }
      .buy:active { transform: scale(0.95); }
      @media (hover: hover) and (pointer: fine) {
        .buy:hover { background: var(--buy-bg-hi); }
      }

      .actions { display: flex; gap: 2px; align-self: start; }
      .act {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        cursor: pointer;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        line-height: 1;
        transition: transform 140ms var(--ease-out), background-color 140ms ease,
          color 140ms ease;
      }
      .act:active { transform: scale(0.92); }
      .act:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
      .act:disabled { opacity: 0.4; cursor: default; }
      @media (hover: hover) and (pointer: fine) {
        .act:hover { background: var(--board); color: var(--ink); }
      }

      /* --- empty ---------------------------------------------------------- */
      .empty { margin: 26px 20px; color: var(--muted); line-height: 1.6; }
      .empty b { display: block; margin-bottom: 3px; color: var(--ink); font-size: 15px; }

      /* --- footer --------------------------------------------------------- */
      footer {
        margin: 14px 16px 0;
        padding-top: 10px;
        border-top: 1px solid var(--board);
        font-size: 10.5px;
        line-height: 1.5;
        color: var(--muted);
      }

      @media (prefers-reduced-motion: reduce) {
        .spine { animation-duration: 1ms; }
        .spine.leaving, .act { transition-duration: 1ms; }
      }
    
      /* --- centred ------------------------------------------------------
         A shelf is a symmetrical object, so everything that is not a book row sits on the
         page's axis: the mark, the name, the count, and each pile label. Book ROWS stay
         left-aligned, because a title is read from its first letter and centring a list
         of names is how a list stops being scannable. */
      header {
        flex-direction: column;
        justify-content: center;
        gap: 3px;
        padding: 14px 16px 12px;
      }
      /* h1 had flex:1, which pushed the mark and the count to opposite edges and left the
         name floating between them. Stacked and centred, the three read as one masthead. */
      header h1 { flex: none; }
      header .brand { display: flex; align-items: center; gap: 8px; }
      header .count { margin: 0; }
      h2 { justify-content: center; text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
      <svg width="21" height="21" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1.5" y="3.5" width="3.5" height="11" rx="1" fill="#ff5a47" />
        <rect x="5.5" y="1.5" width="3.5" height="13" rx="1" fill="#22b584" />
        <rect
          x="10.6"
          y="4"
          width="3.2"
          height="10.5"
          rx="1"
          fill="#6274ff"
          transform="rotate(11 12.2 9.25)"
        />
        <rect x="1.5" y="8.5" width="12.8" height="1.3" fill="#fae636" />
      </svg>
      <h1>Buki</h1>
      </div>
      <span class="count" id="count"></span>
    </header>
    <main id="app"></main>
    <footer id="disclosure" hidden>
      Buy links are affiliate links. Buki may earn a small commission, at no cost to
      you. Nothing else about your shelf leaves this computer.
    </footer>
    <script src="dist/popup.js"></script>
  </body>
</html>
