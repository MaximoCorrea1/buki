<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Buki">
  <!--
    THE CATCHER. A blue ball with two eyes, from Maximo's drawing (newLogo.png), which
    replaced three spines and two stamped cords on 2026-08-17.

    GEOMETRY AND COLOUR ARE tools/mark.mjs, and src/shared/mark.test.ts asserts this file
    agrees with it on both. Every number was sampled out of the PNG rather than redrawn:
    the ball's bounds, both eyes, both catchlights, and the three gradient stops.

    THERE IS NO PLATE ANY MORE, and its removal is the point rather than an omission. The
    old mark needed one: two INK spines on a dark toolbar vanished into it and left a
    single pale bar with two floating cords, which is not the mark. A ball carries its own
    colour and its own silhouette — measured 11.98:1 on black and 8.9:1 on white — so the
    same file now serves the toolbar, the favicon, the tile and a page that owns its own
    background. icons/icon.svg and docs/icon.svg are this drawing too.
  -->
  <!--
    Identical to icons/mark.svg, and that is now correct rather than duplication: the plate
    that used to distinguish this file existed because the OLD mark's two ink spines
    disappeared on a dark toolbar. The ball does not, so there is nothing left to
    distinguish. The two files are kept because the manifest, the favicon and the docs site
    reference different paths; src/shared/mark.test.ts asserts they never diverge.
  -->
  <defs>
    <linearGradient id="bk-ball" x1="14" y1="8" x2="82" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7bcdfc"/>
      <stop offset="0.46" stop-color="#4aa3f9"/>
      <stop offset="1" stop-color="#013ebf"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#bk-ball)"/>
  <ellipse cx="31.3" cy="45.9" rx="13.7" ry="19.5" fill="#091a3b"/>
  <ellipse cx="68.3" cy="45.9" rx="13.7" ry="19.5" fill="#091a3b"/>
  <!-- Up and to the RIGHT of each eye's centre, by the same offset in both. That is where
       the drawing puts the light, and it is what stops the face reading as a stare. -->
  <circle cx="35" cy="35.2" r="3.9" fill="#fdfdfd"/>
  <circle cx="71.4" cy="35.2" r="3.9" fill="#fdfdfd"/>
</svg>
