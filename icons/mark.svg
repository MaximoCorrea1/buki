<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Buki">
  <!--
    The bare mark, for anywhere the page owns its own background. Use icons/icon.svg
    instead for a favicon, Chrome's toolbar or the Web Store tile: those grounds are the
    host's, not ours, and the plate is what makes them ours.

    GEOMETRY IS tools/mark.mjs, and src/shared/mark.test.ts asserts this file agrees with
    it. It previously carried its own numbers, a `rotate(10)` that leaned the caught spine
    the wrong way, and a `#7cc0fd` fallback that measures 1.81:1 on cream.

    THE CORDS ARE CUT WITH A MASK, not painted. A painted cord is a coloured bar: it
    carries a background with it, and the mark would then only work on the one surface
    that background happens to match. Masked, the gaps are genuinely transparent, so this
    file sits on glass, on a plate and on flat paper unchanged. The mask is applied inside
    the rotated group as well, so the caught spine's cords lean with it.
  -->
  <mask id="bk-cords">
    <rect x="-25" y="-25" width="150" height="150" fill="#fff"/>
    <rect x="-25" y="64.6" width="150" height="1.9" fill="#000"/>
    <rect x="-25" y="72.9" width="150" height="1.9" fill="#000"/>
  </mask>
  <g mask="url(#bk-cords)" fill="var(--mark-spine, #0a0f33)">
    <rect x="15" y="6" width="19" height="88" rx="9.5"/>
    <rect x="66" y="6" width="19" height="88" rx="9.5"/>
  </g>
  <g transform="rotate(-8 50 50)" mask="url(#bk-cords)">
    <rect x="40.5" y="7" width="19" height="86" rx="9.5" fill="var(--mark-caught, #2f7fd6)"/>
  </g>
</svg>
