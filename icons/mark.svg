<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Buki">
  <!--
    Three spines on a shelf, one pulled out and lit. Redrawn as geometry from Maximo's
    logo.jpg: bars measured off the raster at 900x900 and divided by 9, so the proportions
    are his and the edges are exact rather than resampled.

    The tilt is 10 degrees, which is what the original measures (102px of drift over 580px
    of height). The two rules are the stamped cords that every generated cover carries, so
    the mark and the covers are the same object seen at two sizes.

    On the original the tilted bar's cords sat at slightly different fractions than the
    side bars'. Here all three share 0.681 and 0.780 of their own length: a generator's
    inconsistency is not a design decision worth preserving.
  -->
  <g fill="var(--mark-spine, #0a0f33)">
    <rect x="16.44" y="6.22" width="18.44" height="87.89" rx="9.22"/>
    <rect x="66.00" y="6.22" width="18.44" height="87.89" rx="9.22"/>
  </g>
  <rect x="41.65" y="10.80" width="18.10" height="80.20" rx="9.05"
        fill="var(--mark-caught, #7cc0fd)" transform="rotate(10 50.7 50.9)"/>
  <g fill="var(--mark-cord, #fbf7ec)">
    <rect x="16.44" y="66.08" width="18.44" height="0.62"/>
    <rect x="16.44" y="74.77" width="18.44" height="0.62"/>
    <rect x="66.00" y="66.08" width="18.44" height="0.62"/>
    <rect x="66.00" y="74.77" width="18.44" height="0.62"/>
    <g transform="rotate(10 50.7 50.9)">
      <rect x="41.65" y="65.42" width="18.10" height="0.62"/>
      <rect x="41.65" y="73.36" width="18.10" height="0.62"/>
    </g>
  </g>
</svg>
